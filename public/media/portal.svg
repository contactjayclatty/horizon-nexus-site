<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" shape-rendering="crispEdges" role="img" aria-label="Blocks of the Nexus portal: a frame of dark blue blocks around a glowing core, with module blocks docking at its sides">
  <title>Nexus modular portal</title>
  <rect width="96" height="96" fill="#080f1d"/>
  <g fill="#0b1729"><rect x="0" y="80" width="96" height="16"/></g>
  <g fill="#1c3552"><rect x="0" y="80" width="96" height="2"/></g>
  <!-- frame -->
  <g fill="#0a1424"><rect x="28" y="16" width="40" height="64"/></g>
  <g fill="#1c3552">
    <rect x="28" y="16" width="40" height="2"/><rect x="28" y="16" width="2" height="64"/>
    <rect x="28" y="24" width="40" height="1"/><rect x="28" y="72" width="40" height="1"/>
    <rect x="36" y="16" width="1" height="8"/><rect x="44" y="16" width="1" height="8"/><rect x="52" y="16" width="1" height="8"/><rect x="60" y="16" width="1" height="8"/>
    <rect x="36" y="72" width="1" height="8"/><rect x="44" y="72" width="1" height="8"/><rect x="52" y="72" width="1" height="8"/><rect x="60" y="72" width="1" height="8"/>
    <rect x="28" y="32" width="8" height="1"/><rect x="28" y="40" width="8" height="1"/><rect x="28" y="48" width="8" height="1"/><rect x="28" y="56" width="8" height="1"/><rect x="28" y="64" width="8" height="1"/>
    <rect x="60" y="32" width="8" height="1"/><rect x="60" y="40" width="8" height="1"/><rect x="60" y="48" width="8" height="1"/><rect x="60" y="56" width="8" height="1"/><rect x="60" y="64" width="8" height="1"/>
  </g>
  <!-- core -->
  <rect x="36" y="25" width="24" height="47" fill="#287be4"/>
  <g fill="#62b6ff"><rect x="36" y="28" width="24" height="3"/><rect x="36" y="38" width="24" height="3"/><rect x="36" y="48" width="24" height="3"/><rect x="36" y="58" width="24" height="3"/><rect x="36" y="66" width="24" height="2"/></g>
  <g fill="#a5dcff"><rect x="40" y="33" width="4" height="2"/><rect x="50" y="44" width="6" height="2"/><rect x="42" y="54" width="4" height="2"/><rect x="48" y="63" width="6" height="2"/></g>
  <!-- module blocks -->
  <g><rect x="6" y="40" width="14" height="14" fill="#02060d"/><rect x="7" y="41" width="12" height="12" fill="#142840"/><rect x="7" y="41" width="12" height="2" fill="#3a6596"/><rect x="7" y="51" width="12" height="2" fill="#040910"/><rect x="11" y="45" width="4" height="4" fill="#62b6ff"/></g>
  <g><rect x="76" y="40" width="14" height="14" fill="#02060d"/><rect x="77" y="41" width="12" height="12" fill="#142840"/><rect x="77" y="41" width="12" height="2" fill="#3a6596"/><rect x="77" y="51" width="12" height="2" fill="#040910"/><rect x="81" y="45" width="4" height="4" fill="#a5dcff"/></g>
  <g><rect x="76" y="62" width="14" height="14" fill="#02060d"/><rect x="77" y="63" width="12" height="12" fill="#142840"/><rect x="77" y="63" width="12" height="2" fill="#3a6596"/><rect x="77" y="73" width="12" height="2" fill="#040910"/><rect x="81" y="67" width="4" height="4" fill="#287be4"/></g>
  <g fill="#62b6ff"><rect x="20" y="46" width="8" height="2"/><rect x="68" y="46" width="8" height="2"/><rect x="70" y="68" width="6" height="2"/><rect x="68" y="56" width="2" height="14"/></g>
</svg>
